[project]
name = "echo-agent"
version = "0.2.0"
description = "A minimal conversational agent foundation."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
echo = "echo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["echo"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
